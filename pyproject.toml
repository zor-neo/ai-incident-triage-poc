[project]
name = "ai-incident-triage"
version = "0.1.0"
description = "AI Incident & Log Triage Service - FastAPI + Amazon Bedrock + DynamoDB (Level 1: CloudOps Foundation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "boto3>=1.35,<2.0",
    "structlog>=24.4,<26.0",
    "python-ulid>=3.0,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    "moto[dynamodb]>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.8,<1.0",
    "bandit>=1.8,<2.0",
]
infra = [
    "aws-cdk-lib>=2.160,<3.0",
    "constructs>=10.4,<11.0",
    "cdk-nag>=2.34,<3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out", ".venv", "infra/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"infra/*" = ["I001"]
# FastAPI's dependency-injection idiom requires Depends() in argument defaults.
"app/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "cdk.out"]

[tool.coverage.run]
source = ["app"]
